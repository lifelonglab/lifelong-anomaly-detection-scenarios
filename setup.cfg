[tool:black]
line-length = 120
target-version = py312

[isort]
profile = black
line_length = 120
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True

[mypy]
strict_optional = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-rpy2.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True
